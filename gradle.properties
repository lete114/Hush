# UI_SPEC §0.1 Method A: this project builds with JDK 21.
#
# This file has no machine-specific paths. Point JAVA_HOME at JDK 21 before building:
#     $env:JAVA_HOME='<path to your JDK 21>'    # PowerShell (current session only)
# The java must be 21 — switching to 25 crashes at the Kotlin 2.2.21 compiler layer (§0.2).
#
# Note: org.gradle.java.home works here but is **ignored** in local.properties
# (only AGP reads that file, and it only understands sdk.dir).

# §0.6: machines with little memory may raise this on OOM, but do not lower it — Compose compilation needs heap space.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

android.useAndroidX=true
android.nonTransitiveRClass=true
