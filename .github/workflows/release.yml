name: release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Decode keystore
        env:
          HUSH_KEYSTORE_BASE64: ${{ secrets.HUSH_KEYSTORE_BASE64 }}
        run: echo "$HUSH_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hush-release.jks"

      - name: Run unit tests
        run: ./gradlew test

      - name: Build signed release APK
        env:
          HUSH_KEYSTORE_FILE: ${{ runner.temp }}/hush-release.jks
          HUSH_KEYSTORE_PASSWORD: ${{ secrets.HUSH_KEYSTORE_PASSWORD }}
          HUSH_KEY_ALIAS: ${{ secrets.HUSH_KEY_ALIAS }}
          HUSH_KEY_PASSWORD: ${{ secrets.HUSH_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Assert tag matches versionName
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_BASE="${TAG_VERSION%%-*}"
          GRADLE_VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$TAG_BASE" != "$GRADLE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (base $TAG_BASE) != versionName $GRADLE_VERSION — bump app/build.gradle.kts first"
            exit 1
          fi

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$APKSIGNER" ]; then
            yes | sdkmanager "build-tools;36.0.0" >/dev/null
            APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          fi
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Stage artifacts
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/hush-v${TAG_VERSION}.apk"
          cp app/build/outputs/mapping/release/mapping.txt dist/mapping.txt

      - name: Generate release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..$GITHUB_REF_NAME"; else RANGE="$GITHUB_REF_NAME"; fi
          git log --pretty='- %s' --no-merges "$RANGE" | grep -v '^- chore' > notes.md || true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/hush-v*.apk dist/mapping.txt --clobber
          else
            EXTRA=""
            case "$GITHUB_REF_NAME" in *-*) EXTRA="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" dist/hush-v*.apk dist/mapping.txt \
              --title "Hush $GITHUB_REF_NAME" --generate-notes -F notes.md $EXTRA
          fi
